<title>Pet Travel Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,500..700&family=Mukta:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#E9EBF1;
  --paper:#F6F7FA;
  --surface:#FFFFFF;
  --sunk:#EEF0F5;
  --line:#DCDFE8;
  --ink:#181B2B;
  --muted:#5A6075;
  --accent:#2E41B5;
  --accent-ink:#FFFFFF;
  --accent-soft:#E6E9FA;
  --ok:#17744A; --ok-soft:#E2F3EA;
  --warn:#8F5600; --warn-soft:#FBEFD9;
  --bad:#B02A20; --bad-soft:#FBE5E2;
  --info:#3C4B7A; --info-soft:#E8EBF4;
  --shadow:0 1px 2px rgba(24,27,43,.06),0 4px 16px rgba(24,27,43,.06);
  --display:"Anek Latin","Mukta",system-ui,sans-serif;
  --body:"Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0C0E15; --paper:#13151E; --surface:#1B1E2A; --sunk:#232736; --line:#2F3447;
    --ink:#E8EAF2; --muted:#A1A7BC; --accent:#8E9CFF; --accent-ink:#11142A; --accent-soft:#252B4F;
    --ok:#5CCB94; --ok-soft:#173226; --warn:#F0B35A; --warn-soft:#3A2B12; --bad:#FF8A7E; --bad-soft:#3D1B18;
    --info:#AEB9E6; --info-soft:#252B42; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0C0E15; --paper:#13151E; --surface:#1B1E2A; --sunk:#232736; --line:#2F3447;
  --ink:#E8EAF2; --muted:#A1A7BC; --accent:#8E9CFF; --accent-ink:#11142A; --accent-soft:#252B4F;
  --ok:#5CCB94; --ok-soft:#173226; --warn:#F0B35A; --warn-soft:#3A2B12; --bad:#FF8A7E; --bad-soft:#3D1B18;
  --info:#AEB9E6; --info-soft:#252B42; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{max-width:440px;margin:0 auto;min-height:100%;background:var(--paper);display:flex;flex-direction:column;position:relative}
@media (min-width:480px){.app{border-inline:1px solid var(--line)}}

.proto{background:var(--ink);color:var(--paper);font-size:13px;padding:6px 16px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.proto b{font-weight:600}
.proto select{min-height:0;width:auto;background:transparent;border:1px solid color-mix(in srgb,var(--paper) 40%,transparent);border-radius:6px;padding:2px 6px;font-size:13px;color:var(--paper);max-width:180px}
.proto select option{color:#181B2B;background:#fff}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 16px;min-height:56px}
.bar h1{font-family:var(--display);font-size:19px;font-weight:650;margin:0;flex:1;text-wrap:balance;line-height:1.2}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;margin-left:-8px}
.iconbtn:hover{background:var(--sunk)}
.iconbtn svg{width:22px;height:22px}

main{flex:1;padding:16px 16px 96px;display:flex;flex-direction:column;gap:20px}
.tabs{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:transparent;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;color:var(--muted);cursor:pointer;min-height:56px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="true"]{color:var(--accent);font-weight:600}

h2{font-family:var(--display);font-size:22px;font-weight:650;margin:0;line-height:1.2;text-wrap:balance}
h3{font-family:var(--display);font-size:17px;font-weight:650;margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.xs{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.flat{background:var(--sunk);border-color:transparent}
.section{display:flex;flex-direction:column;gap:12px;scroll-margin-top:110px}
.section > header{display:flex;flex-direction:column;gap:2px}

.btn{border:1px solid transparent;border-radius:12px;padding:11px 16px;min-height:46px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;line-height:1.2}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.secondary:hover{border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);padding-inline:8px;min-height:40px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:12px;color:var(--muted);font-weight:500}
.vf{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:500;background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 5px;letter-spacing:.02em}

.src{all:unset;cursor:pointer;display:inline-flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--muted);line-height:1.4}
.src:hover .src-t{text-decoration:underline}
.src:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.conf{font-weight:600;font-size:12px;border-radius:4px;padding:0 5px}
.c-official{background:var(--ok-soft);color:var(--ok)}
.c-secondary{background:var(--info-soft);color:var(--info)}
.c-traveller{background:var(--accent-soft);color:var(--accent)}
.c-conflicting{background:var(--warn-soft);color:var(--warn)}
.c-unverified{background:var(--bad-soft);color:var(--bad)}

.reasons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.reasons li{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start}
.reasons li .dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:2px}
.reasons li.b .dot{background:var(--bad-soft);color:var(--bad)}
.reasons li.c .dot{background:var(--warn-soft);color:var(--warn)}
.reasons li.n .dot{background:var(--info-soft);color:var(--info)}
.reasons li.y .dot{background:var(--ok-soft);color:var(--ok)}
.reasons li > div{display:flex;flex-direction:column;gap:2px}

.field{display:flex;flex-direction:column;gap:4px}
.field label,.lbl{font-size:14px;font-weight:600}
.field .hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=tel],input[type=email],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:46px}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px 0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;min-height:40px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer}
.stepper output{font-family:var(--mono);font-size:18px;min-width:24px;text-align:center}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list > *{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;cursor:pointer;color:inherit;text-decoration:none}
.list > *:first-child{border-top:0}
.list > button:hover{background:var(--sunk)}
.list .grow{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.chev{color:var(--muted);flex:none}

/* ticket */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden}
.ticket .t-top{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.ticket .t-route{display:flex;align-items:baseline;gap:10px;font-family:var(--display);font-size:22px;font-weight:650;flex-wrap:wrap}
.ticket .t-route .arr{color:var(--muted);font-weight:500}
.ticket .t-bottom{border-top:1px dashed var(--line);padding:10px 16px;display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.ticket .t-bottom div{display:flex;flex-direction:column}
.ticket .t-bottom span:first-child{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ticket::before,.ticket::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--paper);border:1px solid var(--line);top:calc(100% - 52px)}
.ticket::before{left:-8px}.ticket::after{right:-8px}

/* options */
.opt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.opt.np{background:transparent}
.opt .opt-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.opt .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:13.5px}
.opt .meta div{display:flex;flex-direction:column}
.opt .meta span:first-child{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
details > summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;list-style:none}
details > summary::-webkit-details-marker{display:none}
details[open] > summary{margin-bottom:10px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl .when{font-family:var(--mono);font-size:13px;color:var(--muted);line-height:1.35}
.tl .what{display:flex;flex-direction:column;gap:6px}
.tl .state{display:flex;gap:4px;flex-wrap:wrap}
.tl .state button{border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:12.5px;padding:3px 8px;cursor:pointer;min-height:30px}
.tl .state button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tl .state button.f[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.tl li.done .t-title{text-decoration:line-through;color:var(--muted)}

.jump{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:4;background:var(--paper);margin:-16px -16px 0;padding:8px 16px;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.jump a{flex:none;font-size:13.5px;font-weight:600;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface)}
.jump a:hover{color:var(--accent);border-color:var(--accent)}

.callout{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.callout.warn{background:var(--warn-soft)}
.callout.bad{background:var(--bad-soft)}
.callout.info{background:var(--info-soft)}
.callout.ok{background:var(--ok-soft)}
.callout b{font-weight:700}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted);font-size:14px}
.kv dd{margin:0}

.big-time{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1;font-stretch:90%}

.doc{background:#FFFFFF;color:#1A1A1A;border:1px solid var(--line);border-radius:6px;padding:22px 20px;font-family:Georgia,"Times New Roman",serif;font-size:14.5px;line-height:1.55;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.doc .ph{background:#FFE9B8;border-radius:3px;padding:0 3px;font-family:var(--mono);font-size:12.5px;color:#6B4200}
.doc .filled{background:#E7ECFF;border-radius:3px;padding:0 2px}
.doc h4{margin:0;font-size:15px}
.doc .wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.doc .wm span{transform:rotate(-28deg);font-family:var(--body);font-weight:700;font-size:17px;color:rgba(176,42,32,.22);text-align:center;max-width:90%;line-height:1.3}
.doc .line{border-bottom:1px solid #999;display:inline-block;min-width:90px}

.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,12,20,.45)}
.sheet{background:var(--paper);width:100%;max-width:440px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 0}
.sheet .sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
blockquote{margin:0;border-left:3px solid var(--line);padding:4px 0 4px 12px;color:var(--ink);font-style:italic;font-size:15px}

.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14.5px;max-width:min(400px,calc(100% - 32px));box-shadow:var(--shadow)}

.fit{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:6px 10px;font-size:14px;align-items:center}
.fit .h{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.otp input{text-align:center;font-family:var(--mono);font-size:20px;padding:8px 0}
.hero{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.hero h2{font-size:28px;font-stretch:92%;letter-spacing:-.01em}
.scn{display:grid;grid-template-columns:1fr;gap:8px}
.foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--accent-soft);color:var(--accent);flex:none}
.avatar.cat{background:var(--warn-soft);color:var(--warn)}
.pets-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.pets-row .chip{flex:none}
hr{border:0;border-top:1px solid var(--line);margin:0}
</style>

<div class="app" id="app">
  <div class="proto">
    <span><b>Prototype.</b> Sample data. Rules as of 25 Sep 2026.</span>
    <label class="row" style="gap:6px"><span class="xs">Jump to</span>
      <select id="jump" aria-label="Jump to screen">
        <option value="">Screen…</option>
        <option value="home">Home</option>
        <option value="wizard">Plan a trip</option>
        <option value="s-dog12">Options: 12 kg dog</option>
        <option value="s-cat4">Options: 4 kg cat</option>
        <option value="p-rail">Rail plan</option>
        <option value="p-dogbox">Dog box plan</option>
        <option value="p-air">Flight plan (Akasa cabin)</option>
        <option value="p-uk">Move to the UK</option>
        <option value="p-usa">Move to the USA</option>
        <option value="p-import">Coming to India</option>
        <option value="wrong">Something went wrong</option>
        <option value="letter">Coupe letter (C1)</option>
        <option value="rulesheet">Rule sheet (C2)</option>
        <option value="vet">Vet format (C3)</option>
        <option value="rules">Rules library</option>
        <option value="myths">Common myths</option>
        <option value="pets">Pets and documents</option>
        <option value="report">Trip report</option>
      </select>
    </label>
  </div>
  <div class="bar" id="bar"></div>
  <main id="main"></main>
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
</div>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============================================================
   Dates
   ============================================================ */
const TODAY = (() => { const d = new Date(); d.setHours(12, 0, 0, 0); return d; })();
const D = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addMonths = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
const fmt = d => d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtS = d => d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
const fmtDay = d => d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtT = d => d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true });
const ageMonths = (dob, at) => { let m = (at.getFullYear() - dob.getFullYear()) * 12 + (at.getMonth() - dob.getMonth()); if (at.getDate() < dob.getDate()) m--; return m; };
const ageWeeks = (dob, at) => Math.floor((at - dob) / (7 * 864e5));
const daysBetween = (a, b) => Math.round((b - a) / 864e5);
const maxDate = (...ds) => new Date(Math.max(...ds.map(Number)));
const isWeekend = d => d.getDay() === 0 || d.getDay() === 6;
const ageText = (dob, at = TODAY) => { const m = ageMonths(dob, at); return m < 24 ? `${m} months` : `${Math.floor(m / 12)} years`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inr = n => '₹' + Number(n).toLocaleString('en-IN');

/* ============================================================
   Sources and rules (seed data, from PRD Appendix A)
   ============================================================ */
const SOURCES = {

function fitCheck(carrier, lim) {
  const dims = [['Length', carrier.l, lim.l], ['Width', carrier.w, lim.w], ['Height', carrier.h, lim.h]];
  const rows = dims.map(([n, have, max]) => { const m = +(max - have).toFixed(2); return { n, have, max, m, st: m < 0 ? 'fail' : m <= 0.5 ? 'border' : 'pass' }; });
  let st = rows.some(x => x.st === 'fail') ? 'fail' : rows.some(x => x.st === 'border') ? 'border' : 'pass';
  const softFail = lim.soft && carrier.type !== 'soft';
  if (softFail) st = 'fail';
  return { rows, st, softFail };
}

function evaluate(trip) {
  const pets = trip.petIds.map(pet);
  const out = [];
  const at = D(trip.date);
  const mk = o => Object.assign({ blockers: [], conds: [], notes: [], risk: [] }, o);
  const add = o => out.push(mk(o));
  if (trip.kind === 'domestic') {
    // ---- cabin
    for (const c of AIR_CABIN) {
      const o = { key: c.key, group: 'air', op: c.op, label: c.label, mode: 'Flight · cabin', stress: c.stress, hours: 3, blockers: [], conds: [], notes: [], risk: [] };
      const lim = V(c.w), box = V(c.box);
      for (const p of pets) {
        const wc = petWeightWithCarrier(p);
        if (wc != null && wc > lim.kg) o.blockers.push({ r: c.w, t: `${p.name} weighs ${wc} kg with the carrier. The limit is ${lim.kg} kg.` });
        else if (p.w > lim.kg) o.blockers.push({ r: c.w, t: `${p.name} weighs ${p.w} kg. The limit is ${lim.kg} kg including the carrier.` });
        else if (wc == null) o.conds.push({ r: c.w, t: `Weigh ${p.name} in the carrier. Together they must be ${lim.kg} kg or less.` });
        else o.conds.push({ r: c.w, t: `${p.name} weighs ${wc} kg with the carrier, within the ${lim.kg} kg limit. Airline scales decide on the day.` });
        if (lim.petKg && p.w > lim.petKg) o.blockers.push({ r: c.w, t: `${p.name} weighs ${p.w} kg. Alliance Air takes pets up to ${lim.petKg} kg.` });
        if (c.age) { const [rid, k] = c.age; const min = V(rid)[k]; const ok = k === 'cabinWeeks' ? ageWeeks(D(p.dob), at) >= min : ageMonths(D(p.dob), at) >= min; if (!ok) o.blockers.push({ r: rid, t: `${p.name} will be too young. Minimum age is ${min} ${k === 'cabinWeeks' ? 'weeks' : 'months'}.` }); }
        const cr = carrierOf(p);
        if (cr) { const f = fitCheck(cr, box); if (f.st === 'fail') o.conds.push({ r: c.box, t: `${p.name}'s saved carrier (${cr.l}×${cr.w}×${cr.h} in${f.softFail ? ', hard' : ''}) does not fit. You need a smaller${box.soft ? ', soft' : ''} carrier.` }); else if (f.st === 'border') o.conds.push({ r: c.box, t: `${p.name}'s saved carrier is within 0.5 inch of the limit. Staff may measure it.` }); }
        else o.conds.push({ r: c.box, t: `Carrier must be ${box.soft ? 'soft and ' : ''}no bigger than ${box.l} × ${box.w} × ${box.h} inches.` });
        if (breedFlat(p)) o.notes.push({ r: 'air.air-india.brachy_hold', t: `${p.name} is a flat-faced breed. The cabin is allowed; ask your vet first.` });
      }
      if (trip.infant && c.infant === 'block') o.blockers.push({ r: c.block, t: 'You are travelling with an infant. This airline does not allow a pet in the cabin then.' });
      if (trip.wheelchair && c.wheel === 'block') o.blockers.push({ r: c.block, t: 'You need wheelchair assistance. This airline does not allow a pet in the cabin then.' });
      if (trip.wheelchair && c.wheel === 'warn') o.conds.push({ r: c.block, t: 'Akasa does not recommend pets for passengers who need wheelchair assistance.' });
      const perFlight = V(c.slot).cabin;
      if (pets.length > perFlight) o.blockers.push({ r: c.slot, t: `You have ${pets.length} pets. This airline takes ${perFlight} in the cabin per flight.` });
      if (c.pax && pets.length > trip.travellers) o.blockers.push({ r: c.pax, t: `One pet per passenger. You need at least ${pets.length} travellers.` });
      if (c.network) { const net = V(c.network).cities; if (!net.includes(trip.from) || !net.includes(trip.to)) o.blockers.push({ r: c.network, t: `Fly91 does not serve ${!net.includes(trip.from) ? trip.from : trip.to}.` }); else o.conds.push({ r: c.network, t: 'Check that Fly91 flies your exact route on your date.' }); }
      else o.conds.push({ r: c.slot, t: 'Check that the airline flies your route.' });
      o.conds.unshift({ r: c.slot, t: `A cabin slot must be free on your flight (${perFlight} per flight, first come, first served).` });
      if (c.op === 'alliance') o.conds.push({ r: c.slot, t: 'The captain must approve on the day.' });
      (c.extra || []).forEach(id => o.notes.push({ r: id, t: R(id).s }));
      const f = V(c.fee);
      o.cost = f.cabin ? { min: f.cabin * pets.length, max: f.cabin * pets.length, basis: c.feeNote } : { text: c.feeNote };
      o.lead = c.lead ? `${V(c.lead).hours} h before the flight` : 'Not stated';
      o.stressNote = 'Pet stays with you. Short and familiar.';
      add(o);
    }
    // ---- hold / cargo
    {
      const o = mk({ key: 'air.air-india.hold', group: 'air', op: 'air-india', label: 'Air India, in the hold', mode: 'Flight · hold', stress: 3, hours: 3.5 });
      const lim = V('air.air-india.hold.weight_kg'); const bl = [], co = [];

        ${S.pets.map(p => `<label class="check card" style="flex-direction:row;padding:12px 14px"><input type="checkbox" data-change="wzPet" value="${p.id}" id="wzPet-${p.id}" ${w.petIds.includes(p.id) ? 'checked' : ''}><span class="avatar ${p.species}">${esc(p.name[0])}</span><span><b>${esc(p.name)}</b><br><span class="small muted">${esc(p.breed)} · ${p.w} kg${p.wc ? ` (${p.wc} kg with carrier)` : ''} · ${ageText(D(p.dob))}</span></span></label>`).join('')}
        <button class="btn ghost" data-act="addPet">Add a pet</button>
      </div>
      ${w.err ? `<div class="callout bad">${esc(w.err)}</div>` : ''}
      <div class="grid2"><button class="btn secondary" data-act="wzBack">Back</button><button class="btn primary" data-act="wzDone">See options</button></div>
    </div>`;
  return w.step === 1 ? step1 : step2;
};

/* ---- Options ---- */
VIEWS.options = () => {
  const t = S.trip;
  const opts = sortOptions(evaluate(t));
  const ok = opts.filter(o => o.status !== 'not_possible'), no = opts.filter(o => o.status === 'not_possible');
  const card = o => {
    const [cls, lab] = STATUS[o.status];
    const top = o.status === 'not_possible' ? o.blockers.slice(0, 1) : o.conds.slice(0, 2);
    return `<article class="opt ${o.status === 'not_possible' ? 'np' : ''}">
      <div class="opt-h"><div class="stack-s" style="gap:2px"><span class="eyebrow">${esc(o.mode)}</span><h3>${esc(o.label)}</h3></div><span class="pill ${cls}">${lab}</span></div>
      ${reasons(top, o.status === 'not_possible' ? 'b' : 'c', o.status === 'not_possible' ? '×' : '!')}
      ${o.status !== 'not_possible' ? `<div class="meta"><div><span>Cost</span><span class="mono">${costText(o.cost)}</span></div><div><span>Book by</span><span>${esc(o.lead || '—')}</span></div><div><span>Stress</span><span>${'●'.repeat(Math.min(o.stress, 4))}<span class="muted">${'○'.repeat(4 - Math.min(o.stress, 4))}</span></span></div></div>
      ${o.cost?.basis ? `<p class="xs muted">Cost: ${esc(o.cost.basis)}.</p>` : ''}
      <p class="small">${esc(o.stressNote || '')}</p>` : ''}
      ${(o.blockers.length + o.conds.length + o.notes.length + o.risk.length) > top.length ? `<details><summary>All reasons and sources</summary><div class="stack">
        ${o.blockers.length ? `<div class="stack-s"><span class="lbl">Why not</span>${reasons(o.blockers, 'b', '×')}</div>` : ''}
        ${o.conds.length ? `<div class="stack-s"><span class="lbl">Conditions</span>${reasons(o.conds, 'c', '!')}</div>` : ''}
        ${o.notes.length ? `<div class="stack-s"><span class="lbl">Good to know</span>${reasons(o.notes, 'n', 'i')}</div>` : ''}
        ${o.risk.length ? `<div class="callout warn">${o.risk.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
      </div></details>` : ''}
      ${o.status !== 'not_possible' ? `<button class="btn primary" data-act="choose" data-arg="${o.key}">Choose this</button>` : ''}
    </article>`;
  };
  return `${ticket(t)}
  <div class="stack-s"><span class="lbl">Sort by</span><div class="seg">${[['stress', 'Lowest stress'], ['cost', 'Lowest cost'], ['fast', 'Fastest']].map(([k, l]) => `<button data-act="prio" data-arg="${k}" aria-pressed="${S.priority === k}">${l}</button>`).join('')}</div></div>
  <p class="small muted">${ok.length} options can work, ${no.length} cannot.${t.kind === 'domestic' ? ' No cabin option is ever certain, because each flight takes only 1 or 2 pets.' : ''}</p>
  <div class="stack">${ok.map(card).join('')}</div>
  ${no.length ? `<section class="section"><header><h3>Not possible for this trip</h3></header><div class="stack">${no.map(card).join('')}</div></section>` : ''}`;
};

/* ---- Plan ---- */
function taskList(tasks) {
  return `<ol class="tl">${tasks.map(t => { const st = S.tasks[t.id] || 'todo'; return `<li class="${st === 'done' ? 'done' : ''}"><span class="when">${t.when}</span><div class="what"><span class="t-title"><b>${esc(t.title)}</b></span>${t.detail ? `<span class="small muted">${t.detail}</span>` : ''}${t.warn ? `<span class="small" style="color:var(--warn)">${esc(t.warn)}</span>` : ''}${t.r ? src(t.r) : ''}
    <div class="state" role="group" aria-label="Task state">${[['todo', 'To do'], ['done', 'Done'], ['skipped', 'Skipped'], ['failed', 'Failed']].map(([k, l]) => `<button class="${k === 'failed' ? 'f' : ''}" data-act="task" data-arg="${t.id}|${k}" aria-pressed="${st === k}">${l}</button>`).join('')}</div></div></li>`; }).join('')}</ol>`;
}
function trainsFor(trip) {
  return TRAINS.filter(tr => { const i = tr.stops.findIndex(s => s[2] === trip.from); const j = tr.stops.findIndex(s => s[2] === trip.to); return i >= 0 && j > i; });
}
function chartTime(dateStr, hhmm) {
  const c = V('rail.ir.chart.first_chart'); const [h, m] = hhmm.split(':').map(Number);
  const dep = D(dateStr); dep.setHours(h, m, 0, 0);
  const mins = h * 60 + m, [a, b] = c.morningWindow.map(x => { const [p, q] = x.split(':').map(Number); return p * 60 + q; });
  if (mins >= a && mins < b) { const x = addDays(dep, -1); const [ch, cm] = c.morningChartTime.split(':').map(Number); x.setHours(ch, cm, 0, 0); return { dep, chart: x, rule: 'morning' }; }
  return { dep, chart: new Date(dep - c.firstChartHoursBefore * 3600e3), rule: 'hours' };
}

VIEWS.plan = () => {
  const t = S.trip, o = evaluate(t).find(x => x.key === t.option);
  if (!o) return '<p>Choose an option first.</p>';
  if (o.group === 'rail') return railPlan(t, o);
  if (o.group === 'air') return airPlan(t, o);
  if (t.kind === 'import') return importPlan(t, o);
  return intlPlan(t, o);
};
function planHead(t, o, links) {
  const [cls, lab] = STATUS[o.status];
  return `<nav class="jump" aria-label="Sections">${links.map(([id, l]) => `<a href="#${id}" data-act="jumpTo" data-arg="${id}">${l}</a>`).join('')}</nav>
  ${ticket(t)}
  <div class="card"><div class="row between"><div class="stack-s" style="gap:0"><span class="eyebrow">Chosen option</span><h3>${esc(o.label)}</h3></div><span class="pill ${cls}">${lab}</span></div>
  <div class="stack-s"><button class="btn danger block" data-act="goWrong">Something went wrong</button><button class="btn secondary block" data-act="pack">Trip pack (works offline)</button></div></div>`;
}

function railPlan(t, o) {
  const trains = trainsFor(t);
  if (!S.rail.train || !trains.find(x => x.no === S.rail.train)) { S.rail.train = trains[0]?.no || null; S.rail.board = null; }
  const tr = TRAINS.find(x => x.no === S.rail.train);
  const boardOpts = tr ? tr.stops.filter((s, i) => i < tr.stops.findIndex(z => z[2] === t.to)) : [];
  if (tr && (!S.rail.board || !boardOpts.find(s => s[0] === S.rail.board))) S.rail.board = (boardOpts.find(s => s[2] === t.from) || boardOpts[0])[0];
  const bs = tr ? tr.stops.find(s => s[0] === S.rail.board) : null;
  const isOrigin = tr && tr.stops[0][0] === S.rail.board;
  const dep = bs ? bs[3] : '20:00';
  const origin = tr ? tr.stops[0] : null;
  const ct = chartTime(t.date, dep);
  const date = D(t.date);
  const arp = V('rail.ir.booking.arp_days').days;
  const office = OFFICES[origin ? origin[2] : t.from];
  const letterDay = addDays(date, -(office?.lead || 4));

    { id: 'book', when: fmtS(addDays(date, -arp)), title: `Book ${t.travellers >= 3 ? '4' : '2'} First AC berths on one PNR`, detail: 'Booking opens on this date. Choose the coupe preference if shown.', r: 'rail.ir.booking.arp_days' },
    { id: 'letter', when: fmtS(letterDay), title: 'Submit the coupe request letter', detail: office ? esc(office.office) : 'Office for this division not collected yet.', warn: isWeekend(letterDay) ? `This is a ${letterDay.toLocaleDateString('en-IN', { weekday: 'long' })}. Offices may be closed; go on the Friday before.` : '', r: 'rail.ir.coupe.request_office' },
    { id: 'wl', when: fmtS(addDays(date, -2)), title: 'Decision point if still waitlisted or RAC', detail: 'Keep and prepare a fallback, rebook a confirmed 1A ticket, or switch mode.' },
    { id: 'vet', when: `${fmtS(addDays(date, -2))}–${fmtS(addDays(date, -1))}`, title: 'Vet fitness certificate', detail: 'Issued 24 to 48 hours before the journey.', r: 'rail.ir.docs.fitness_cert_hours_before' },
    { id: 'chart', when: `${fmtS(ct.chart)}<br>${fmtT(ct.chart)}`, title: 'Check your coupe status at charting', detail: 'Reminders: the day before, 1 hour before, and at charting.', r: 'rail.ir.chart.first_chart' },
    { id: 'petticket', when: `${fmtS(ct.chart)}`, title: 'Book the pet ticket online', detail: 'After the first chart, before the final chart.', r: 'rail.ir.pet_ticket.online_window' },
    { id: 'leave', when: `${fmtS(ct.dep)}<br>${fmtT(ct.dep)}`, title: `Board at ${bs ? bs[1] : 'your station'}`, detail: 'Carry printed documents and the rule sheet.' },
  ] : variant === 'rail.dogbox' ? [
    { id: 'book', when: fmtS(addDays(date, -arp)), title: 'Book your own ticket (any class)', detail: 'Pick a train that likely has a dog box.', r: 'rail.ir.dogbox.availability' },
    { id: 'vet', when: `${fmtS(addDays(date, -2))}–${fmtS(addDays(date, -1))}`, title: 'Vet fitness certificate', r: 'rail.ir.docs.fitness_cert_hours_before' },
    { id: 'parcel', when: `${fmtS(ct.dep)}<br>${fmtT(new Date(ct.dep - 3 * 3600e3))}`, title: 'Book the dog at the parcel office', detail: 'At least 3 hours before departure. Hand the guard\'s foil to the guard.', r: 'rail.ir.pet_ticket.offline_min_hours_before' },
    { id: 'leave', when: `${fmtS(ct.dep)}<br>${fmtT(ct.dep)}`, title: 'Board, and check on the dog at long halts' },
  ] : [
    { id: 'book', when: fmtS(addDays(date, -arp)), title: 'Book a confirmed ticket (any class)', r: 'rail.ir.booking.arp_days' },
    { id: 'vet', when: `${fmtS(addDays(date, -2))}–${fmtS(addDays(date, -1))}`, title: 'Vet fitness certificate', r: 'rail.ir.docs.fitness_cert_hours_before' },
    { id: 'sm', when: fmtS(ct.dep), title: 'Get Station Master permission and pay the luggage charge', r: 'rail.ir.basket.kitten_puppy_any_class' },
  ];
  const links = [['s-train', 'Train'], ['s-time', 'Timeline'], ...(variant === 'rail.1a' ? [['s-book', 'Booking'], ['s-letter', 'Letter'], ['s-chart', 'Chart day'], ['s-ticket', 'Pet ticket'], ['s-fall', 'Fallback']] : []), ['s-board', 'On board']];
  const ans = S.chartAns;
  return `${planHead(t, o, links)}
  <section class="section" id="s-train"><header><h3>Your train</h3><p class="xs muted">Sample train data for this prototype. The app will use a train data provider.</p></header>
    ${trains.length ? `<div class="field"><label for="trainSel">Train</label><select id="trainSel" data-change="train">${trains.map(x => `<option value="${x.no}" ${x.no === S.rail.train ? 'selected' : ''}>${x.no} ${esc(x.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="boardSel">Boarding station</label><select id="boardSel" data-change="board">${boardOpts.map(s => `<option value="${s[0]}" ${s[0] === S.rail.board ? 'selected' : ''}>${esc(s[1])} (${s[0]}), dep ${s[3]}</option>`).join('')}</select></div>
    <div class="card"><ul class="reasons">
      <li class="${tr.has1A ? 'y' : 'b'}"><span class="dot">${tr.has1A ? '✓' : '×'}</span><div><span>${tr.has1A ? `Has First AC (${tr.coaches1A} coach)` : 'No First AC on this train. Pick another train.'}</span></div></li>
      <li class="${isOrigin ? 'y' : 'c'}"><span class="dot">${isOrigin ? '✓' : '!'}</span><div><span>${isOrigin ? `You board at the origin, ${esc(origin[1])}.` : `The train starts at ${esc(origin[1])}. You board mid-route.`} Travellers report better coupe odds when boarding at the origin. This is not a rule.</span>${trav('rrail')}</div></li>
      <li class="${tr.rake === 'ICF' ? 'y' : 'n'}"><span class="dot">${tr.rake === 'ICF' ? '✓' : 'i'}</span><div><span>${tr.rake === 'ICF' ? 'Older ICF rake: a brake-van dog box is likely.' : 'LHB rake: dog box unknown.'}</span>${src('rail.ir.dogbox.availability')}</div></li>
      <li class="n"><span class="dot">i</span><div><span>Long halts (5+ minutes): ${tr.stops.filter(s => s[5] >= 5).map(s => `${esc(s[1])} ${s[3]} (${s[5]} min)`).join(', ') || 'none'}.</span></div></li>
    </ul></div>` : `<div class="callout warn">No sample trains between ${esc(t.from)} and ${esc(t.to)}. Try Delhi, Mumbai, Bengaluru or Kolkata. In the app you can also enter a train number.</div>`}
  </section>
  <section class="section" id="s-time"><header><h3>Timeline</h3><p class="small muted">Dates update when you change the travel date. Mark a task as failed to open the fallback steps.</p></header>
    <div class="field"><label for="planDate">Travel date</label><input type="date" id="planDate" value="${t.date}" min="${iso(TODAY)}" data-change="planDate"></div>

  <section class="section" id="s-book"><header><h3>Booking strategy</h3></header>
    <div class="card">
      ${t.travellers === 1 ? `<p><b>You travel alone.</b> A single ticket rarely gets a coupe. Book 2 berths on one PNR for yourself and a real person travelling with you.</p><p class="small muted">An empty berth can be given to someone else by the TTE. Do not book a berth in a made-up name or in your pet's name.</p>`
        : t.travellers === 2 ? `<p><b>Two travellers:</b> book 2 First AC berths on one PNR and choose the coupe preference.</p>`
        : t.travellers <= 4 ? `<p><b>${t.travellers} travellers:</b> book 4 First AC berths on one PNR, so a full cabin can be allotted.</p>`
        : `<p><b>${t.travellers} travellers:</b> a cabin holds 4. Book 4 berths on the PNR that travels with the pet.</p>`}
      ${reasons([{ r: 'rail.ir.dog.allowed_classes', t: 'The whole coupe or cabin must be on your PNR.' }, { r: 'rail.ir.dog.allowed_classes', t: 'Your ticket must be confirmed. Waitlisted and RAC tickets cannot get a coupe.' }], 'c', '!')}
    </div>
    <details class="card"><summary>Still waitlisted close to travel?</summary>
      <p class="small">Decide by ${fmt(addDays(date, -2))}. Options:</p>
      <ul class="small"><li>Keep the ticket and prepare the fallback plan.</li><li>Book a confirmed 1A ticket on another train or date. Cancellation charges apply to the old ticket.</li><li>Switch to a flight, if your pet qualifies, or road.</li></ul>
    </details>
  </section>
  <section class="section" id="s-letter"><header><h3>Coupe request letter</h3><p class="small muted">It can improve your chances. It is not required and does not guarantee a coupe.</p></header>
    ${src('rail.ir.coupe.request_office')}
    <div class="card">
      <span class="eyebrow">Where to submit (${esc(origin ? origin[2] : t.from)} division, train origin)</span>
      ${office ? `<dl class="kv"><dt>Office</dt><dd>${esc(office.office)}</dd><dt>Drop point</dt><dd>${esc(office.drop)}</dd><dt>How</dt><dd>${esc(office.methods)}</dd><dt>Hours</dt><dd>${esc(office.hours)} <span class="vf">VERIFY</span></dd><dt>Submit by</dt><dd>${fmtDay(letterDay)} (${office.lead} days before)</dd></dl>
      <div class="row"><span class="conf c-traveller">Traveller-reported</span><a class="xs" href="${SOURCES[office.src].url}" target="_blank" rel="noopener">${esc(SOURCES[office.src].t)}</a></div>`
      : `<p>We have not collected this office yet. Travellers name the DRM office, Chief Reservation Officer or zonal HQ. Call the division's commercial office to confirm.</p>`}
      ${!isOrigin && tr ? `<p class="small">You board mid-route. Send the letter to the origin division first; also ask at your boarding division.</p>` : ''}
    </div>
    <div class="grid2"><button class="btn primary" data-act="go" data-arg="letter">Draft the letter</button><button class="btn secondary" data-act="letterSubmitted">${S.tasks.letter === 'done' ? 'Submitted ✓' : 'Mark as submitted'}</button></div>
  </section>
  <section class="section" id="s-chart"><header><h3>Chart day</h3></header>
    <div class="card">
      <span class="eyebrow">Expected first chart</span>
      <span class="big-time mono">${fmtDay(ct.chart)}, ${fmtT(ct.chart)}</span>
      <p class="small muted">${ct.rule === 'morning' ? 'Your train leaves between 5 am and 2 pm, so the chart is due by 8 pm the evening before.' : 'About 10 hours before departure from the charting station.'} This is an estimate. Check your PNR status.</p>
      ${src('rail.ir.chart.first_chart')}
    </div>
    <span class="lbl">What did you get?</span>
    <div class="stack-s">${[['full', 'Full coupe or cabin on my PNR'], ['shared', 'A cabin shared with another PNR'], ['none', 'No coupe or cabin'], ['unsure', 'Not sure']].map(([k, l]) => `<button class="btn ${ans === k ? 'primary' : 'secondary'} block" data-act="chartAns" data-arg="${k}">${l}</button>`).join('')}</div>
    ${ans === 'full' ? `<div class="callout ok"><b>Good. Book the pet ticket now.</b><span>Online booking is open until the final chart. See the steps below.</span><button class="btn primary sm" data-act="jumpTo" data-arg="s-ticket">Go to pet ticket</button></div>` : ''}
    ${ans === 'shared' ? `<div class="callout warn"><b>This does not meet the rule.</b><span>The whole cabin must be on your PNR. If a co-passenger objects, the dog can be moved to the guard's van with no refund. The TTE has discretion.</span>${src('rail.ir.copassenger_objection')}<button class="btn primary sm" data-act="jumpTo" data-arg="s-fall">See the fallback plan</button></div>` : ''}
    ${ans === 'none' ? `<div class="callout bad"><b>No coupe was allotted.</b><span>Online pet booking will not accept this PNR. See your fallback options.</span><button class="btn primary sm" data-act="jumpTo" data-arg="s-fall">See the fallback plan</button></div>` : ''}
    ${ans === 'unsure' ? `<div class="callout info"><b>How to check</b><span>Open PNR status and note the berth numbers. A coupe is 2 berths in one enclosed compartment; a cabin is 4. If all berths in that compartment are on your PNR, you have it.</span><span class="vf">VERIFY coupe berth numbers per coach type</span></div>` : ''}
  </section>
  <section class="section" id="s-ticket"><header><h3>Pet ticket</h3></header>
    <div class="card"><span class="eyebrow">Online (main way)</span>
      <ol class="small" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>After the first chart, open IRCTC → Trains → Dogs/Cats Booking.</li><li>Log in with your mobile OTP and email.</li><li>Enter your PNR. The system checks that a coupe or cabin is on it.</li><li>Choose the number of pets and pay.</li><li>Save a screenshot of the confirmation. The email often does not arrive.</li></ol>
      ${src('rail.ir.pet_ticket.online_url')}
      <p class="mono small" style="user-select:all">parcel.indianrail.gov.in/LTBook</p>
    </div>
    <details class="card"><summary>It says "No Dog/Cat booking allowed"</summary><ol class="small" style="margin:0;padding-left:20px"><li>Check that the whole coupe or cabin is on your PNR.</li><li>Wait a few minutes and try again.</li><li>Try another browser or device.</li><li>Go to the parcel office at least 3 hours before departure.</li></ol>${src('rail.ir.pet_ticket.offline_min_hours_before')}</details>
    <div class="card flat"><span class="eyebrow">Parcel office (fallback)</span><p class="small">Go at least 3 hours before departure with the documents. Opening hours are not yet collected for ${esc(bs ? bs[1] : 'this station')}.${ct.dep.getHours() < 8 ? ` <b>Your train leaves at ${fmtT(ct.dep)}. The office may be closed 3 hours earlier.</b>` : ''}</p></div>
    <dl class="kv"><dt>Fare</dt><dd>${inr(160)}–${inr(800)} per pet ${src('rail.ir.fare.reported_range_inr')}</dd><dt>Refund</dt><dd>None, even if the train is cancelled ${src('rail.ir.pet_ticket.refund')}</dd></dl>
  </section>
  <section class="section" id="s-fall"><header><h3>Fallback plan</h3><p class="small muted">If no coupe, or if you are refused. In order:</p></header>
    <div class="list">${[
      ['ask', 'Ask at the origin station', 'Ask the reservation office or the TTE whether a coupe can be reassigned after charting. Traveller-reported; not guaranteed.'],
      ['dogbox', 'Brake-van dog box', tr && tr.rake === 'ICF' ? 'This train likely has one. One dog per box. Book at the parcel office 3 hours before.' : 'This train may not have one (LHB rake). Ask at the parcel office.'],
      ['rebook', 'Cancel and rebook', 'Another train or date. Cancellation charges apply. Any pet fare already paid is not refunded.'],
      ['switch', 'Switch mode', 'A flight if your pet qualifies, road, or a pet transporter.'],
    ].map(([k, tl, d]) => `<button data-act="fallback" data-arg="${k}"><span class="grow"><b>${tl}</b><span class="small muted">${d}</span></span>${S.fallbackTaken === k ? '<span class="pill ok">I did this</span>' : ''}</button>`).join('')}</div>
    ${pets.some(p => breedFlat(p) || ageMonths(D(p.dob), date) >= 96) ? `<div class="callout warn"><b>Dog box not advised for ${pets.filter(p => breedFlat(p) || ageMonths(D(p.dob), date) >= 96).map(p => esc(p.name)).join(', ')}.</b><span>Flat-faced and elderly pets are at high risk in a closed brake van. Thresholds will be set by a vet.</span></div>` : ''}
  </section>` : ''}
  ${variant === 'rail.dogbox' ? `<div class="callout warn"><b>Safety</b>${o.risk.map(x => `<span>${esc(x)}</span>`).join('')}${src('rail.ir.dogbox.restraint')}</div>` : ''}
  <section class="section" id="s-board"><header><h3>On board</h3></header>
    <div class="card">${['Leash, collar and chain', 'Muzzle, if your dog needs one', 'Water and a bowl', 'Food for the journey', 'Pee pads', ...(pets.some(p => p.species === 'cat') ? ['Litter tray and litter'] : []), 'Cleaning supplies', 'Printed documents: fitness certificate, vaccination card, tickets, ID'].map((x, i) => `<label class="check"><input type="checkbox" id="cl-${i}" data-change="cl" data-k="${i}" ${S.checklist[i] ? 'checked' : ''}><span>${esc(x)}</span></label>`).join('')}</div>
    <div class="grid2"><button class="btn secondary" data-act="go" data-arg="rulesheet">Rule sheet for staff</button><button class="btn secondary" data-act="go" data-arg="vet">Vet format</button></div>
    <details class="card"><summary>If asked to pay a fine</summary><p class="small">The official penalty for an unbooked dog is six times the luggage rate. Any fine must come with an official railway receipt. Do not make informal payments. If you are asked to, note the time and place and complain on RailMadad.</p>${src('rail.ir.penalty.unbooked_dog')}<button class="btn ghost sm" data-act="wrongItem" data-arg="fine">RailMadad complaint text</button></details>
  </section>
  <section class="section"><header><h3>After the trip</h3></header><button class="btn secondary block" data-act="go" data-arg="report">Answer the trip report (90 seconds)</button></section>`;

  else if (c === 'usa') steps = [

  <div class="stack-s"><span class="lbl">Type</span><div class="seg"><button type="button" data-act="carType" data-arg="soft" aria-pressed="${(S.params.type || 'soft') === 'soft'}">Soft</button><button type="button" data-act="carType" data-arg="hard" aria-pressed="${S.params.type === 'hard'}">Hard</button></div></div>
  <div class="stack-s"><span class="lbl">Unit</span><div class="seg"><button type="button" data-act="carUnit" data-arg="in" aria-pressed="${(S.params.unit || 'in') === 'in'}">Inches</button><button type="button" data-act="carUnit" data-arg="cm" aria-pressed="${S.params.unit === 'cm'}">Centimetres</button></div></div>
  <div class="grid3"><div class="field"><label for="cL">Length</label><input type="number" id="cL" required step="0.1" min="1"></div><div class="field"><label for="cW">Width</label><input type="number" id="cW" required step="0.1" min="1"></div><div class="field"><label for="cH">Height</label><input type="number" id="cH" required step="0.1" min="1"></div></div>
  <div class="field"><label for="cKg">Empty weight (kg)</label><input type="number" id="cKg" step="0.1" min="0"></div>
  <button class="btn primary block">Save carrier</button></form>`;

/* ---- Report ---- */
VIEWS.report = () => {
  if (S.reportDone) return `<div class="card"><h3>Thank you</h3><p>Your report is anonymous. When 5 or more travellers report on the same train or office, we show the counts to others, labelled Traveller-reported.</p></div><button class="btn secondary" data-act="tab" data-arg="home">Back to home</button>`;
  const Q = [['origin', 'Did you board at the origin station?'], ['letter', 'Did you submit a coupe letter?'], ['coupe', 'Did you get a coupe or cabin?'], ['online', 'Did you book the pet ticket online?'], ['docs', 'Were your documents checked?'], ['problem', 'Did you have any problems?']];
  return `<p class="small muted">Six quick questions. About 90 seconds.</p>
  ${Q.map(([k, q]) => `<div class="stack-s"><span class="lbl">${q}</span><div class="seg">${['Yes', 'No', 'Not sure'].map(a => `<button data-act="rep" data-arg="${k}|${a}" aria-pressed="${S.report[k] === a}">${a}</button>`).join('')}</div></div>`).join('')}
  <div class="field"><label for="repText">Anything others should know? (optional)</label><textarea id="repText" style="min-height:80px" placeholder="Reviewed before it is shown"></textarea></div>
  <button class="btn primary block" data-act="repSubmit">Send report</button>`;
};

/* ============================================================
   Scenarios
   ============================================================ */
function baseTrip(x) { return Object.assign({ kind: 'domestic', from: 'Delhi', to: 'Bengaluru', country: 'uk', date: iso(addDays(TODAY, 21)), ret: '', travellers: 2, infant: false, wheelchair: false, petIds: ['p1'], tor: null, reimport: null, option: null }, x); }
function scenarioTrip(k) {
  return {
    's-dog12': baseTrip({ petIds: ['p1'] }),
    's-cat4': baseTrip({ from: 'Mumbai', to: 'Delhi', petIds: ['p2'] }),
    's-pug': baseTrip({ petIds: ['p3'] }),
    's-infant': baseTrip({ from: 'Bengaluru', to: 'Hyderabad', petIds: ['p2'], infant: true }),
    'p-uk': baseTrip({ kind: 'export', from: 'Delhi', country: 'uk', date: iso(addDays(TODAY, 90)), petIds: ['p1'] }),
    'p-usa': baseTrip({ kind: 'export', from: 'Mumbai', country: 'usa', date: iso(addDays(TODAY, 75)), petIds: ['p1'] }),
    's-aus': baseTrip({ kind: 'export', from: 'Bengaluru', country: 'australia', date: iso(addDays(TODAY, 90)), petIds: ['p2'] }),
    'p-import': baseTrip({ kind: 'import', from: 'Canada', to: 'Bengaluru', date: iso(addDays(TODAY, 60)), petIds: ['p1'], tor: false, reimport: false }),
    'p-rail': baseTrip({ from: 'Bengaluru', to: 'Delhi', petIds: ['p1'], option: 'rail.1a' }),
    'p-dogbox': baseTrip({ from: 'Delhi', to: 'Bengaluru', travellers: 1, petIds: ['p1'], option: 'rail.dogbox' }),
    'p-air': baseTrip({ from: 'Mumbai', to: 'Delhi', petIds: ['p2'], option: 'air.akasa.cabin' }),
  }[k];
}
function runScenario(k) {
  const t = scenarioTrip(k); S.trip = t; S.chartAns = null; S.stack = [{ view: 'home', params: {} }];
  if (k === 'p-uk' || k === 'p-usa') { t.option = 'intl.' + t.country; S.intl = { chip: true, vacc: iso(addDays(TODAY, -40)), titre: '' }; }
  if (k === 'p-import') t.option = 'intl.import';
  if (k === 'p-rail') S.rail = { train: '90001', board: 'SBC' };
  if (k === 'p-dogbox') S.rail = { train: '90004', board: 'NDLS' };
  if (t.option) { S.stack.push({ view: 'options', params: {} }); S.view = 'plan'; S.params = {}; }
  else { S.view = 'options'; S.params = {}; }
  render(); window.scrollTo(0, 0);
}

/* ============================================================
   Actions
   ============================================================ */
const A = {
  back, tab: v => tab(v), go: v => go(v),
  rule: id => {
    const r = R(id); const due = dueOn(r);
    openSheet(`<div class="sh-h"><div class="stack-s" style="gap:2px"><span class="eyebrow">${esc(OPS[r.op])}</span><span class="xs mono muted" style="word-break:break-all">${r.id}</span></div><button class="iconbtn" data-act="closeSheet" aria-label="Close">✕</button></div>
      <p style="font-size:17px">${esc(r.s)}</p>
      ${r.q ? `<div class="stack-s"><span class="lbl">Official text</span><blockquote>${esc(r.q)}</blockquote></div>` : ''}
      <div class="row"><span class="conf c-${r.conf}">${CONF[r.conf]}</span>${r.verify ? '<span class="vf">VERIFY</span>' : ''}</div>
      ${r.verify ? `<div class="callout warn"><span><b>Open item:</b> ${esc(r.verify)}</span></div>` : ''}
      ${r.note ? `<div class="callout info"><span>${esc(r.note)}</span></div>` : ''}
      ${overdue(r) ? `<div class="callout bad"><span><b>Being re-checked.</b> This rule is past its review date.</span></div>` : ''}
      <div class="stack-s"><span class="lbl">Sources</span>${r.src.length ? r.src.map(k => { const s = SOURCES[k]; return `<div class="card flat" style="gap:4px"><a href="${s.url}" target="_blank" rel="noopener">${esc(s.t)}</a><span class="xs muted">${s.type === 'official' ? 'Official source' : s.type === 'secondary' ? 'Secondary source' : 'Traveller reports'}${s.date ? ` · dated ${fmt(D(s.date))}` : ''} · read ${fmt(D(r.checked))}</span></div>`; }).join('') : '<div class="callout bad"><span>No source yet. This value is a placeholder and cannot ship.</span></div>'}</div>
      <dl class="kv small"><dt>Last checked</dt><dd>${fmt(D(r.checked))}</dd><dt>Review every</dt><dd>${r.every} days</dd><dt>Next review</dt><dd>${fmt(due)}</dd><dt>Change history</dt><dd>Version 1 (seed). No changes yet.</dd></dl>
      <button class="btn primary" data-act="planFromRule">Plan a trip with this</button>`);
  },
  closeSheet,
  planFromRule: () => { closeSheet(); A.startWizard(); },
  startWizard: () => { S.wz = { step: 1, kind: 'domestic', from: 'Delhi', to: 'Bengaluru', country: 'uk', fromCountry: 'Canada', date: iso(addDays(TODAY, 21)), ret: '', travellers: 2, infant: false, wheelchair: false, petIds: [S.pets[0].id], tor: null, reimport: null }; go('wizard'); },
  editTrip: () => { const t = S.trip; S.wz = { step: 1, ...t, fromCountry: t.kind === 'import' ? t.from : 'Canada' }; go('wizard'); },
  wzKind: k => { S.wz.kind = k; S.wz.err = ''; if (k === 'export' && !AQCS_CITIES.includes(S.wz.from)) S.wz.from = 'Delhi'; if (k === 'import' && !AQCS_CITIES.includes(S.wz.to)) S.wz.to = 'Bengaluru'; render(); },
  wzTor: k => { S.wz.tor = k === 'yes'; if (S.wz.tor) S.wz.reimport = null; render(); },
  wzRe: k => { S.wz.reimport = k === 'yes'; render(); },
  wzNext: () => { const w = S.wz; w.err = ''; if (w.kind === 'domestic' && w.from === w.to) w.err = 'Choose different cities for from and to.'; else if (!w.date || D(w.date) < TODAY) w.err = 'Choose a travel date from today onwards.'; else if (w.kind === 'import' && (w.tor === null || (w.tor === false && w.reimport === null))) w.err = 'Answer the residence question so we can show the right route.'; else w.step = 2; render(); window.scrollTo(0, 0); },
  wzBack: () => { S.wz.step = 1; S.wz.err = ''; render(); },
  wzTrav: d => { S.wz.travellers = Math.min(8, Math.max(1, S.wz.travellers + +d)); render(); },
  wzDone: () => { const w = S.wz; if (!w.petIds.length) { w.err = 'Choose at least one pet.'; render(); return; } const t = baseTrip({ kind: w.kind, from: w.kind === 'import' ? (w.fromCountry || 'Abroad') : w.from, to: w.to, country: w.country, date: w.date, ret: w.ret, travellers: w.travellers, infant: w.infant, wheelchair: w.wheelchair, petIds: [...w.petIds], tor: w.tor, reimport: w.reimport }); S.trip = t; S.chartAns = null; S.stack = S.stack.filter(x => x.view !== 'wizard' && x.view !== 'options'); go('options'); },
  prio: k => { S.priority = k; render(); },
  choose: key => { S.trip.option = key; S.trip.optionLabel = evaluate(S.trip).find(o => o.key === key).label; S.chartAns = null; if (key.startsWith('intl.') && key !== 'intl.import' && !S.intl.vacc) S.intl = { chip: true, vacc: '', titre: '' }; go('plan'); },
  scenario: k => runScenario(k),
  jumpTo: (id, el, e) => { e.preventDefault(); const n = document.getElementById(id); if (n) n.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); },
  task: arg => { const [id, st] = arg.split('|'); S.tasks[id] = st; if (st === 'failed') { toast('Opening what to do next'); go('wrong'); } else render(); },
  chartAns: k => { S.chartAns = k; render(); document.getElementById('s-chart')?.scrollIntoView({ block: 'start' }); },
  fallback: k => { S.fallbackTaken = k; toast('Noted. This feeds your trip report.'); render(); },
  letterSubmitted: () => { S.tasks.letter = 'done'; toast(`Letter marked as submitted on ${fmt(TODAY)}`); render(); },
  goWrong: () => go('wrong'),
  wrongItem: k => go('wrongDetail', { k }),
  pack: () => openSheet(`<div class="sh-h"><h3>Trip pack</h3><button class="iconbtn" data-act="closeSheet" aria-label="Close">✕</button></div><p>The trip pack holds your timeline, checklist, documents and the rule sheet. Once opened, it works offline on the train.</p><div class="list"><button data-act="go" data-arg="rulesheet"><span class="grow"><b>Rule sheet</b><span class="small muted">One A4 page for staff</span></span>${ICON.chev}</button><button data-act="go" data-arg="vet"><span class="grow"><b>Vet certificate format</b><span class="small muted">For your vet to sign</span></span>${ICON.chev}</button></div><p class="small muted">PDF download, image checklist (1080 × 1350) and WhatsApp sharing come in the real build.</p>`),
  save: () => { if (S.signedIn) { toast('Trip already saved'); return; } openSheet(signInSheet()); },
  sendCode: () => { const v = document.getElementById(S.authTab === 'email' ? 'aEmail' : 'aPhone').value.trim(); if (!v) { S.authErr = S.authTab === 'email' ? 'Enter your email address.' : 'Enter your 10-digit mobile number.'; openSheet(signInSheet()); return; } S.contact = v; S.codeSent = true; S.authErr = ''; openSheet(signInSheet()); document.querySelector('.otp input')?.focus(); },
  verify: () => { const code = [...document.querySelectorAll('.otp input')].map(i => i.value).join(''); if (code.length !== 6) { S.authErr = 'Enter the 6-digit code.'; openSheet(signInSheet()); return; } S.signedIn = true; S.codeSent = false; S.authErr = ''; const t = S.trip; if (t && !S.trips.includes(t)) S.trips.unshift(t); closeSheet(); render(); toast(document.getElementById('consent')?.checked === false ? 'Trip saved. Reminders are off.' : 'Trip saved. Reminders are set.'); },
  addPet: () => go('petForm', { sp: 'dog' }),
  editPet: id => go('petForm', { id, sp: pet(id).species, breed: pet(id).breed }),
  openPet: id => go('pet', { id }),
  petSp: k => { const name = document.getElementById('pName')?.value; S.params.sp = k; S.params.breed = BREEDS[k][0][0]; render(); if (name) document.getElementById('pName').value = name; },
  addCarrier: () => go('carrierForm', { type: 'soft', unit: 'in' }),
  carType: k => { S.params.type = k; keepForm(render); },
  carUnit: k => { S.params.unit = k; keepForm(render); },
  delDoc: id => { S.docs = S.docs.filter(d => d.id !== id); toast('Document deleted'); render(); },
  openTrip: i => { S.trip = S.trips[+i]; go(S.trip.option ? 'plan' : 'options'); },
  copyText: t => copy(t),
  copyEl: id => copy(document.getElementById(id).value),
  exportNote: () => toast('PDF and DOCX export come in the real build.'),
  rep: arg => { const [k, a] = arg.split('|'); S.report[k] = a; render(); },
  repSubmit: () => { S.reportDone = true; render(); window.scrollTo(0, 0); },
};
function keepForm(fn) { const vals = {}; document.querySelectorAll('#main input, #main select').forEach(i => { if (i.id) vals[i.id] = i.type === 'checkbox' ? i.checked : i.value; }); fn(); Object.entries(vals).forEach(([id, v]) => { const i = document.getElementById(id); if (i) { if (i.type === 'checkbox') i.checked = v; else if (i.type !== 'file') i.value = v; } }); }
function signInSheet() {
  const tabK = S.authTab || 'phone';
  return `<div class="sh-h"><h3>Save your trip</h3><button class="iconbtn" data-act="closeSheet" aria-label="Close">✕</button></div>
  <p class="small muted">Sign in to save the trip and get reminders. We collect only what the trip needs.</p>
  ${S.codeSent ? `<div class="stack"><p>Enter the 6-digit code sent to <b>${esc(S.contact)}</b>.</p><div class="otp">${Array.from({ length: 6 }, (_, i) => `<input type="text" inputmode="numeric" maxlength="1" aria-label="Digit ${i + 1}" id="otp${i}">`).join('')}</div><p class="xs muted">Prototype: any 6 digits work.</p>
    <label class="check"><input type="checkbox" id="consent" checked><span class="small">Send me reminders for this trip by web push and email. You can turn them off per trip.</span></label>
    ${S.authErr ? `<div class="callout bad">${esc(S.authErr)}</div>` : ''}<button class="btn primary block" data-act="verify">Verify and save</button><button class="btn ghost" data-act="authTab" data-arg="${tabK}">Use a different ${tabK === 'email' ? 'email' : 'number'}</button></div>`
  : `<div class="seg"><button data-act="authTab" data-arg="phone" aria-pressed="${tabK === 'phone'}">Phone</button><button data-act="authTab" data-arg="email" aria-pressed="${tabK === 'email'}">Email</button></div>
    ${tabK === 'phone' ? `<div class="field"><label for="aPhone">Mobile number</label><div class="row" style="flex-wrap:nowrap"><span class="mono">+91</span><input type="tel" id="aPhone" inputmode="numeric" maxlength="10" placeholder="98765 43210"></div></div>` : `<div class="field"><label for="aEmail">Email</label><input type="email" id="aEmail" placeholder="you@example.com"></div>`}
    ${S.authErr ? `<div class="callout bad">${esc(S.authErr)}</div>` : ''}<button class="btn primary block" data-act="sendCode">Send code</button>`}`;
}
A.authTab = k => { S.authTab = k; S.codeSent = false; S.authErr = ''; openSheet(signInSheet()); };

document.addEventListener('click', e => {
  if (e.target.id === 'sheetWrap') { closeSheet(); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.closest('#sheet') && ['go', 'rule'].includes(t.dataset.act) && t.dataset.act === 'go') closeSheet();
  const fn = A[t.dataset.act]; if (fn) { if (t.tagName === 'A') e.preventDefault(); fn(t.dataset.arg, t, e); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); if (e.target.matches('.otp input') && e.key === 'Backspace' && !e.target.value) e.target.previousElementSibling?.focus(); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('.otp input')) { t.value = t.value.replace(/\D/g, ''); if (t.value) t.nextElementSibling?.focus(); return; }
  if (t.dataset.input === 'letter') { S.letter[t.dataset.k] = t.value; const id = t.id, pos = t.selectionStart; render(); const n = document.getElementById(id); n.focus(); try { n.setSelectionRange(pos, pos); } catch { } }
  if (t.dataset.input === 'rq') { S.params.q = t.value; const pos = t.selectionStart; render(); const n = document.getElementById('rq'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('change', e => {
  const t = e.target, c = t.dataset.change;
  if (!c) { if (t.id === 'jump') { const v = t.value; t.value = ''; jump(v); } return; }
  if (c === 'wz') { S.wz[t.dataset.k] = t.value; S.wz.err = ''; if (t.dataset.k === 'date' && S.wz.ret && S.wz.ret < t.value) S.wz.ret = ''; render(); }
  if (c === 'wzBool') { S.wz[t.dataset.k] = t.checked; }
  if (c === 'wzPet') { const ids = S.wz.petIds; if (t.checked) ids.push(t.value); else S.wz.petIds = ids.filter(x => x !== t.value); }
  if (c === 'train') { S.rail.train = t.value; S.rail.board = null; render(); }
  if (c === 'board') { S.rail.board = t.value; render(); }
  if (c === 'planDate') { if (t.value && D(t.value) >= TODAY) { S.trip.date = t.value; render(); toast('Dates recalculated'); } }
  if (c === 'flightCar') { S.flight.carrier = t.value; render(); }
  if (c === 'flTime') { S.flight.time = t.value || '10:00'; render(); }
  if (c === 'bookRef') { S.flight.ref = t.value; if (t.value) toast('Pet booking reference saved'); }
  if (c === 'intl') { S.intl[t.dataset.k] = t.value; render(); }
  if (c === 'intlChip') { S.intl.chip = t.checked; render(); }
  if (c === 'impVacc') { S.imp.vacc = t.value; render(); }
  if (c === 'cl') { S.checklist[t.dataset.k] = t.checked; }
  if (c === 'letterSel') { S.letter[t.dataset.k] = t.value; render(); }
  if (c === 'petBreed') { S.params.breed = t.value.replace(' (flat-faced)', ''); keepForm(render); }
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target.dataset.form;
  if (f === 'search') { const q = document.getElementById('homeSearch').value; tab('rules'); S.params.q = q; render(); }
  if (f === 'rulesSearch') { }
  if (f === 'pet') {
    const g = id => document.getElementById(id);
    const data = { name: g('pName').value.trim(), species: S.params.sp, breed: g('pBreed').value.replace(' (flat-faced)', ''), flat: g('pFlat')?.checked || false, dob: g('pDob').value, w: +g('pW').value, wc: g('pWc').value ? +g('pWc').value : null, chip: g('pChip').value.trim(), carrier: g('pCar').value || null };
    if (data.wc != null && data.wc < data.w) { toast('Weight with carrier must be at least the pet\'s weight.'); return; }
    if (S.params.id) { Object.assign(pet(S.params.id), data); toast('Saved'); back(); }
    else { const id = 'p' + Date.now(); S.pets.push({ id, ...data }); if (S.wz) S.wz.petIds.push(id); toast(`${data.name} added`); back(); }
  }
  if (f === 'carrier') {
    const g = id => +document.getElementById(id).value; const k = S.params.unit === 'cm' ? 1 / 2.54 : 1;
    const c = { id: 'c' + Date.now(), name: document.getElementById('cName').value.trim(), type: S.params.type || 'soft', l: +(g('cL') * k).toFixed(1), w: +(g('cW') * k).toFixed(1), h: +(g('cH') * k).toFixed(1), kg: document.getElementById('cKg').value ? g('cKg') : null };
    S.carriers.push(c); S.flight.carrier = c.id; toast('Carrier saved' + (S.params.unit === 'cm' ? ' (stored in inches)' : '')); back();
  }
  if (f === 'vacc') { const g = id => document.getElementById(id).value; S.vacc.push({ id: 'v' + Date.now(), pet: S.params.id, type: g('vType'), given: g('vGiven'), until: g('vUntil') || iso(addDays(D(g('vGiven')), 365)), vet: g('vVet') }); toast('Vaccination added'); render(); }
  if (f === 'doc') { const file = document.getElementById('dFile').files[0]; if (!file) return; if (file.size > 10485760) { toast('That file is over 10 MB. Choose a smaller one.'); return; } S.docs.push({ id: 'd' + Date.now(), pet: S.params.id, type: document.getElementById('dType').value, file: file.name, expires: document.getElementById('dExp').value || null }); toast('Uploaded privately'); render(); }
});
function jump(v) {
  if (!v) return;
  if (v.startsWith('s-') || v.startsWith('p-')) return runScenario(v);
  if (v === 'wizard') return A.startWizard();
  if (['letter', 'rulesheet', 'vet', 'report', 'wrong'].includes(v)) { if (!S.trip) runScenario('p-rail'); else if (v === 'wrong' || v === 'letter') { if (!S.trip.option?.startsWith('rail')) runScenario('p-rail'); } S.stack = [{ view: 'home', params: {} }]; return go(v); }
  if (['rules', 'pets', 'home', 'trips'].includes(v)) return tab(v);
  if (v === 'myths') { tab('rules'); return go('myths'); }
}

render();
</script>
